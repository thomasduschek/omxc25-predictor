name: Update OMXC25 market data

on:
  # Kører mandag-fredag kl. 19:00 UTC
  # = 21:00 dansk sommertid / 20:00 dansk vintertid
  schedule:
    - cron: "0 19 * * 1-5"

  # Gør det også muligt at starte opdateringen manuelt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Nasdaq data
        run: python -m src.fetch_nasdaq

      - name: Import Nasdaq data
        run: python -m src.import_nasdaq

      - name: Update C25 membership
        run: python -m src.build_c25_membership_history

      - name: Check official OMXC25 constituents
        id: c25_check
        run: |
            set +e
            python -m src.fetch_c25_constituents --strict
            code=$?
            echo "exit_code=$code" >> "$GITHUB_OUTPUT"
            exit 0

      - name: Verify database
        run: |
          python - <<'PY'
          from src.db import connect

          con = connect()

          result = con.execute("""
              SELECT
                  COUNT(DISTINCT ticker) AS securities,
                  MAX(date) AS latest_date
              FROM daily_market
          """).fetchone()

          print(f"Securities: {result[0]}")
          print(f"Latest market date: {result[1]}")

          con.close()
          PY

      - name: Commit updated database
        run: |
          if git diff --quiet db/omxc25.duckdb; then
            echo "No new market data to commit."
            exit 0
          fi

          git config user.name "OMXC25 Data Bot"
          git config user.email "actions@github.com"

          git add db/omxc25.duckdb
          git commit -m "Update Nasdaq market data"
          git push

      - name: Report OMXC25 constituent status
        run: |
            code="${{ steps.c25_check.outputs.exit_code }}"

            if [ "$code" = "0" ]; then
              echo "## ✅ OMXC25 membership OK" >> "$GITHUB_STEP_SUMMARY"
              echo "Nasdaq's official OMXC25 basket matches the local membership history." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$code" = "2" ]; then
              echo "## ⚠️ OMXC25 CHANGE DETECTED" >> "$GITHUB_STEP_SUMMARY"
              echo "Nasdaq's official OMXC25 basket differs from the local membership history." >> "$GITHUB_STEP_SUMMARY"
              echo "Market data has still been updated and committed." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ "$code" = "3" ]; then
              echo "## ❌ Invalid OMXC25 component count" >> "$GITHUB_STEP_SUMMARY"
              echo "Nasdaq did not return exactly 25 OMXC25 securities." >> "$GITHUB_STEP_SUMMARY"
              echo "No membership change has been applied." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "## ❌ Unexpected OMXC25 check result" >> "$GITHUB_STEP_SUMMARY"
            echo "Exit code: $code" >> "$GITHUB_STEP_SUMMARY"
            exit 1
